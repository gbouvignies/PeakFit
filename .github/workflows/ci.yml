name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        # 'uv sync' automatically installs the project + 'dev' dependency group
        run: uv sync

      - name: Lint (Ruff)
        run: uv run ruff check

      - name: Format (Ruff)
        run: uv run ruff format --check

      - name: Type Check (ty)
        # Checks entire project by default.
        run: uv run ty check

      - name: Import Linter
        run: uv run lint-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # --all-extras installs 'mcmc', 'profiling' etc.
        run: uv sync --all-extras

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        # pyproject.toml already handles coverage paths and branch settings.
        # We only need to specify the XML report for Codecov here.
        run: uv run pytest --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }} # Recommended for v4+
