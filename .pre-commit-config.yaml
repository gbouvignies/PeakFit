repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      # debug-statements is kept as a safety net (catches pdb/breakpoints)

  - repo: local
    hooks:
      - id: ruff
        name: Ruff Check
        # Uses config from pyproject.toml. --fix automatically corrects simple errors.
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: Ruff Format
        # Enforces the format defined in pyproject.toml (quotes, indentation, etc.)
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      - id: ty
        name: ty
        # Type checking with ty.
        # pass_filenames: false -> Runs on the whole project.
        # Since ty is extremely fast, checking the whole project is preferred
        # to ensure no regression in files you didn't touch.
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: lint-imports
        name: Import Linter
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
