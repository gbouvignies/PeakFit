# Import Linter contracts for PeakFit
# Run locally:  importlinter lint --config tools/contracts/importlinter.yml
contracts:
  - name: CLI should not import engine directly
    type: forbidden
    source: peakfit.cli
    forbidden:
      - peakfit.engine

  - name: Engine is infrastructure-agnostic
    type: forbidden
    source: peakfit.engine
    forbidden:
      - peakfit.cli
      - peakfit.ui
      - peakfit.fit
      - peakfit.plot
      - peakfit.io
      - peakfit.mcmc

  - name: Fit slice does not import CLI/UI/plotting
    type: forbidden
    source: peakfit.fit
    forbidden:
      - peakfit.cli
      - peakfit.ui
      - peakfit.plot
      - peakfit.mcmc

  - name: MCMC slice does not import CLI/UI/plotting
    type: forbidden
    source: peakfit.mcmc
    forbidden:
      - peakfit.cli
      - peakfit.ui
      - peakfit.plot

  - name: IO should not depend on UI or CLI
    type: forbidden
    source: peakfit.io
    forbidden:
      - peakfit.cli
      - peakfit.ui

  - name: Plotting is not used by Engine/IO
    type: forbidden
    source:
      - peakfit.engine
      - peakfit.io
    forbidden:
      - peakfit.plot
