[project]
name = "peakfit"
version = "2025.11.0"
description = "Lineshape fitting for pseudo-ND NMR spectra"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Guillaume Bouvignies", email = "guillaume.bouvignies@ens.psl.eu" }
]
keywords = ["NMR", "fitting", "spectroscopy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "contourpy>=1.3",
  "emcee>=3.1.6",
  "matplotlib>=3.10.8",
  "nmrglue>=0.11",
  "numpy>=2.4.0",
  "pandas>=3.0.0",
  "pydantic>=2.5.0",
  "pyqtgraph>=0.14",
  "pyside6>=6.6.0",
  "rich>=13.7.1",
  "scipy>=1.17.0",
  "threadpoolctl>=3.0.0",
  "typer>=0.9.0",
]

[project.urls]
Repository = "https://github.com/gbouvignies/peakfit"

[project.scripts]
peakfit = "peakfit.cli.app:app"

# Development tools managed by `uv sync` / `uv run`
[dependency-groups]
dev = [
  "import-linter>=2.0",
  "prek>=0.4.4",
  "pytest>=9.0",
  "pytest-cov>=6.0.0",
  "pytest-timeout>=2.2.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.8.0",
  "ty>=0.0.11",
]
# Not installed by default: the storage benchmarks' HDF5 comparison only.
benchmarks = ["h5py>=3.15.1"]

[build-system]
requires = ["uv_build>=0.5.0,<0.12"]
build-backend = "uv_build"

# --- Tool Configurations ---

# h5py comes from the optional `benchmarks` group, absent from the default environment.
[[tool.ty.overrides]]
include = ["tools/benchmark_review_projection.py", "tools/benchmark_scientific_storage.py"]
rules = { unresolved-import = "ignore" }

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
exclude_lines = [
  # --- Standard ---
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
  "@abstractmethod",
  'if __name__ == "__main__":',
  # --- Scientific / Architecture Specific ---
  "raise NotImplementedError",  # Common in abstract base classes
  "\\.\\.\\.",  # Regex for "..." (Ellipsis)
]

[tool.importlinter]
root_package = "peakfit"
exclude_type_checking_imports = false
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layering"
type = "layers"
layers = [
  "__main__",
  "cli",
  "gui | ui",
  "fit | mcmc | plot",
  "io",
  "engine",
  "shared"
]
containers = ["peakfit"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Independence: Modules"
type = "acyclic_siblings"
ancestors = [
  "peakfit.engine",
  "peakfit.gui",
  "peakfit.fit",
  "peakfit.io",
  "peakfit.mcmc",
  "peakfit.plot",
  "peakfit.shared",
  "peakfit.ui"
]
# Type-only references between mutually dependent modules (annotations only).
# An ignored edge that no longer exists fails the contract, so this list stays exact.
ignore_imports = [
  "peakfit.engine.types -> peakfit.engine.domain.param_map",
  "peakfit.engine.types -> peakfit.engine.domain.params_scalar",
  "peakfit.engine.domain.params_scalar -> peakfit.engine.domain.peaks",
  "peakfit.engine.lineshapes.utils -> peakfit.engine.lineshapes.grid",
  "peakfit.gui.editor.persistence -> peakfit.gui.editor.window",
  "peakfit.gui.editor.fitting -> peakfit.gui.editor.workspace",
]

[[tool.importlinter.contracts]]
name = "Scientific code imports no interface framework"
type = "forbidden"
source_modules = [
  "peakfit.engine",
  "peakfit.fit",
  "peakfit.io",
  "peakfit.mcmc",
  "peakfit.shared"
]
forbidden_modules = ["PySide6", "pyqtgraph", "typer", "rich", "matplotlib"]

[[tool.importlinter.contracts]]
name = "Plotting imports no Qt; peakfit gui is the one graphical interface"
type = "forbidden"
source_modules = ["peakfit.plot"]
forbidden_modules = ["PySide6", "pyqtgraph"]

[tool.pytest]
addopts = ["--strict-config", "--strict-markers", "-ra"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:nmrglue.*",
  "ignore::FutureWarning:numpy.*",
]
markers = [
  "gui: tests requiring PySide6",
  "mcmc: tests requiring emcee",
  "slow: marks tests as slow",
]
minversion = "9.0"
testpaths = ["tests"]
# Fail a hung Qt event loop or child process instead of blocking CI; the slowest
# test takes about 25 s.
timeout = "300"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# Selected high-value rules.
# Defaults (E, F) + imports (I) + upgrades (UP) + bugbear (B) +
# pytest (PT) + import hygiene (TID, ICN) + builtin-shadowing/unused-
# argument/raise/return/string/logging conventions (A, ARG, RSE, RET,
# ISC, G) + simplification/performance nits (PIE, PERF) + timezone-aware
# datetimes (DTZ) + NumPy (NPY) + type-checking imports (TC) +
# direct-print cleanup (T20) + stale-noqa cleanup (RUF100).
select = [
  "A",
  "ARG",
  "E",
  "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "C4",
  "EXE",
  "G",
  "ICN",
  "ISC",
  "SIM",
  "PTH",
  "PL",
  "PT",
  "RET",
  "RSE",
  "RUF",
  "RUF100",
  "D",
  "DTZ",
  "NPY",
  "PERF",
  "PIE",
  "TC",
  "T20",
  "TID"
]
ignore = [
  "D100",
  "D104",
  "D107",  # Missing docstrings in public modules/init (optional)
  "PLR0913",  # Too many arguments
  "RUF001",
  "RUF002",
  "RUF003",  # Unicode (Greek letters)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# Disallow relative imports from parent directories (e.g. from ..utils import x)
# This forces package-qualified imports and makes architecture boundaries clear.
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
  "D",  # Documentation not needed in tests
  "PLR2004",  # Allow magic values in tests (assert x == 5)
]
"src/peakfit/engine/domain/cluster.py" = ["TC001"]
# Archived evidence for docs/profile-uncertainty.md: scripts whose output is their
# printout, written in the specification's notation (L, S, P; l for a peak).
"tools/profile_uncertainty/*" = ["T201", "N806", "N803", "E741", "PLR2004", "D103"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = [
  "pydantic.validate_call",
  "pydantic.field_validator",
  "pydantic.model_validator",
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
  # Allow Pydantic's `@validator` decorator to trigger class method treatment.
  "pydantic.validator",
  "pydantic.field_validator",
]

[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["pydantic.Field"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pydantic.Field"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
