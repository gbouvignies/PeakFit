# Scenario 3: Multi-step fitting

[fitting]
lineshape = "auto"

[[fitting.steps]]
name = "linewidths_only"
description = "Optimize linewidths with shifts fixed"
fix = ["*.*.cs"]
iterations = 1

[[fitting.steps]]
name = "full_optimization"
description = "Release all parameters"
vary = ["*"]
iterations = 2

[parameters]
position_window = 0.1

[parameters.position_windows]
F2 = 0.3
F3 = 0.03

[clustering]
contour_factor = 5.0

[output]
directory = "Fits/scenario3"
formats = ["json", "csv"]
include_timestamp = false
