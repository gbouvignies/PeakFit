# Config-driven workflow for Example 2.
# This writes a stable, non-timestamped output directory.

exclude_planes = []

[fitting]
lineshape = "auto"
refine_iterations = 1
fit_phase = []

[clustering]
contour_factor = 5.0

[output]
directory = "Fits-config"
formats = ["csv", "txt"]
include_timestamp = false
headless = true
save_simulated = false
