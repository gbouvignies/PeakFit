# Config-driven workflow for Example 2.
# This writes a stable, non-timestamped output directory.

exclude_planes = []

[fitting]
lineshape = "auto"
strategy_name = "varpro"
refine_iterations = 1
fix_positions = false
fit_j_coupling = false
fit_phase = []

[clustering]
contour_factor = 5.0

[output]
directory = "Fits-config"
formats = ["json", "csv", "txt"]
verbosity = "standard"
include_timestamp = false
headless = true
save_simulated = false
save_html_report = false
