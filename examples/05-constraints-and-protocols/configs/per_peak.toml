# Scenario 2: Per-peak constraint overrides

[fitting]
lineshape = "auto"
refine_iterations = 1

[parameters]
position_window = 0.1

[parameters.position_windows]
F2 = 0.3
F3 = 0.03

[parameters.defaults]
"*.*.lw" = { min = 5.0, max = 100.0 }

[parameters.peaks."2N-H"]
position_window = 0.01

[parameters.peaks."3N-H"]
position_window = 0.01

[parameters.peaks."4N-H"]
position_window = 0.2

[parameters.peaks."4N-H".position_windows]
F2 = 0.5
F3 = 0.05

[clustering]
contour_factor = 5.0

[output]
directory = "Fits/scenario2"
formats = ["json", "csv", "txt"]
verbosity = "standard"
include_timestamp = false
